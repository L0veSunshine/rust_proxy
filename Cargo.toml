[package]
name = "rust_proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.67", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
bytes = { version = "1.12.1", features = ["serde"] }
rand = "0.10.3"
rustls = { version = "0.23.45", default-features = false, features = ["logging", "std", "ring"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["logging", "ring"] }
rustls-pemfile = "2.1.3"
uuid = { version = "1.26.1", features = ["v4"] }
socket2 = "0.6.2"
moka = { version = "0.12.16", features = ["future"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
chrono = "0.4.45"
flate2 = "1.1.10"
hmac = "0.13.0"
sha2 = "0.11.0"
serde_json = "1.0.151"
dashmap = { version = "6.2.1", features = ["serde"] }
toml = "1.1.6"
thiserror = "2.0.21"
axum = "0.8.9"
http = "1.5.0"
redb = "4.3.0"
hex = "0.4.3"
governor = "0.10.4"
sysinfo = "0.39.6"

[profile.release]
strip = true      # 强制剔除符号（缩小 GNU 体积的关键）
lto = true        # 开启全程序优化
opt-level = "z"   # 针对体积优化